<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Kisaan Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">Kisaan Connect 🌾</a>
                <ul class="nav-links" id="main-nav"></ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Manage Products</h1>
        
        <div id="products-list" class="grid grid-3" style="margin-top: 2rem;">
            <!-- JS Populated -->
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Kisaan Connect</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        if (!App.Auth.requireRole('admin')) throw new Error('Unauthorized');
        const list = document.getElementById('products-list');

        function loadProducts() {
            const products = App.Store.get(App.Constants.STORAGE_KEYS.PRODUCTS, []);
            const users = App.Store.get(App.Constants.STORAGE_KEYS.USERS, []);
            
            list.innerHTML = '';

            if (products.length === 0) {
                list.innerHTML = '<p>No products found.</p>';
                return;
            }

            products.forEach(p => {
                const farmer = users.find(u => u.id === p.farmerId) || { name: 'Unknown' };
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3>${p.name}</h3>
                        <p class="text-muted">Farmer: ${farmer.name}</p>
                    </div>
                    <p>Price: ₹${p.price} / ${p.unit}</p>
                    <p>Qty: ${p.quantity}</p>
                    
                    <div style="margin-top: 1rem;">
                        <button class="btn btn-danger btn-small" onclick="deleteProduct(${p.id})">Delete Product</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        window.deleteProduct = function(id) {
            if (!confirm('Delete this product?')) return;
            let products = App.Store.get(App.Constants.STORAGE_KEYS.PRODUCTS, []);
            products = products.filter(p => p.id !== id);
            App.Store.set(App.Constants.STORAGE_KEYS.PRODUCTS, products);
            App.UI.showToast('Product deleted');
            loadProducts();
        }

        loadProducts();
    </script>
</body>
</html>
