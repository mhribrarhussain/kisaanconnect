<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Kisaan Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">Kisaan Connect 🌾</a>
                <ul class="nav-links" id="main-nav"></ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Admin Dashboard</h1>
        <p class="text-muted">System Overview</p>

        <div class="grid grid-3" style="margin-top: 2rem;">
            <div class="card">
                <h3>Total Users</h3>
                <h2 id="user-count" style="margin: 1rem 0; color: var(--primary-color);">0</h2>
                <a href="admin_users.html" class="btn btn-primary btn-small">Manage Users</a>
            </div>
            <div class="card">
                <h3>Total Products</h3>
                <h2 id="product-count" style="margin: 1rem 0; color: var(--accent-color);">0</h2>
                <a href="admin_products.html" class="btn btn-primary btn-small">Manage Products</a>
            </div>
            <div class="card">
                <h3>Total Orders</h3>
                <h2 id="order-count" style="margin: 1rem 0; color: var(--text-color);">0</h2>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Kisaan Connect</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        if (!App.Auth.requireRole('admin')) throw new Error('Unauthorized');

        const users = App.Store.get(App.Constants.STORAGE_KEYS.USERS, []);
        const products = App.Store.get(App.Constants.STORAGE_KEYS.PRODUCTS, []);
        const orders = App.Store.get(App.Constants.STORAGE_KEYS.ORDERS, []);

        document.getElementById('user-count').textContent = users.length;
        document.getElementById('product-count').textContent = products.length;
        document.getElementById('order-count').textContent = orders.length;
    </script>
</body>
</html>
