<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kisaan Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">Kisaan Connect 🌾</a>
                <ul class="nav-links" id="main-nav">
                    <!-- JS will populate -->
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div style="max-width: 400px; margin: 2rem auto;">
            <div class="card">
                <h2 class="text-center" style="margin-bottom: 1.5rem;">Login</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                </form>
                <p class="text-center mt-1">
                    Don't have an account? <a href="register.html">Register here</a>
                </p>
            </div>
            <div class="alert alert-success mt-1">
                <strong>Demo Credentials:</strong><br>
                Farmer: ramesh@kisaan.com / password<br>
                Consumer: sita@kisaan.com / password<br>
                Admin: admin@kisaan.com / password
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Kisaan Connect</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const user = App.Auth.login(email, password);
            
            if (user) {
                App.UI.showToast('Login Successful!');
                setTimeout(() => {
                    if (user.role === 'farmer') window.location.href = 'farmer_dashboard.html';
                    else if (user.role === 'consumer') window.location.href = 'consumer_dashboard.html';
                    else if (user.role === 'admin') window.location.href = 'admin_dashboard.html';
                }, 1000);
            } else {
                App.UI.showToast('Invalid email or password', 'error');
            }
        });
    </script>
</body>
</html>
