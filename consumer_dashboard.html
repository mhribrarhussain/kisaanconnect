<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumer Dashboard - Kisaan Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">Kisaan Connect 🌾</a>
                <ul class="nav-links" id="main-nav"></ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Consumer Dashboard</h1>
        <p class="text-muted" id="welcome-msg">Welcome back!</p>

        <div class="grid grid-2" style="margin-top: 2rem;">
            <div class="card">
                <h3>Browse Marketplace</h3>
                <p>Find fresh produce directly from farmers.</p>
                <div style="margin-top: 1rem;">
                    <a href="all_products.html" class="btn btn-primary">Browse Products</a>
                </div>
            </div>
            <div class="card">
                <h3>My Requests</h3>
                <p>Track status of your orders and negotiations.</p>
                <div style="margin-top: 1rem;">
                    <a href="my_requests.html" class="btn btn-secondary">View Requests</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Kisaan Connect</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        if (!App.Auth.requireRole('consumer')) throw new Error('Unauthorized');
        const user = App.Auth.getCurrentUser();
        document.getElementById('welcome-msg').textContent = `Welcome back, ${user.name}`;
    </script>
</body>
</html>
