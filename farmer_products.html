<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products - Kisaan Connect</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">Kisaan Connect 🌾</a>
                <ul class="nav-links" id="main-nav"></ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="flex justify-between items-center">
            <h1>My Products</h1>
            <button id="add-btn" class="btn btn-primary">Add Product</button>
        </div>

        <div id="products-grid" class="grid grid-3" style="margin-top: 2rem;">
            <!-- JS Populated -->
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="product-modal" class="modal hidden">
        <div class="card" style="width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
            <div class="card-header flex justify-between items-center">
                <h3 id="modal-title">Add Product</h3>
                <button class="btn btn-outline btn-small" onclick="closeModal()">X</button>
            </div>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label for="p-name">Product Name</label>
                    <input type="text" id="p-name" required>
                </div>
                <div class="form-group">
                    <label for="p-desc">Description</label>
                    <textarea id="p-desc" rows="3" required></textarea>
                </div>
                <div class="grid grid-2">
                    <div class="form-group">
                        <label for="p-price">Price (₹)</label>
                        <input type="number" id="p-price" required>
                    </div>
                    <div class="form-group">
                        <label for="p-unit">Unit (e.g., kg, quintal)</label>
                        <input type="text" id="p-unit" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="p-qty">Available Quantity</label>
                    <input type="number" id="p-qty" required>
                </div>
                
                <div class="flex gap-1" style="margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary" style="flex:1">Save</button>
                    <button type="button" class="btn btn-secondary" style="flex:1" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Kisaan Connect</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        if (!App.Auth.requireRole('farmer')) throw new Error('Unauthorized');
        const user = App.Auth.getCurrentUser();

        const modal = document.getElementById('product-modal');
        const form = document.getElementById('product-form');
        const grid = document.getElementById('products-grid');

        // Render Products
        function loadProducts() {
            const products = App.Store.get(App.Constants.STORAGE_KEYS.PRODUCTS, []).filter(p => p.farmerId === user.id);
            grid.innerHTML = '';
            
            if (products.length === 0) {
                grid.innerHTML = '<p class="text-muted text-center" style="grid-column: 1/-1;">No products listed yet.</p>';
                return;
            }

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3>${p.name}</h3>
                    </div>
                    <p>${p.description}</p>
                    <p style="margin: 0.5rem 0;"><strong>₹${p.price}</strong> / ${p.unit}</p>
                    <p class="text-muted">Stock: ${p.quantity} ${p.unit}</p>
                    <div class="flex gap-1" style="margin-top: 1rem;">
                        <button class="btn btn-secondary btn-small" onclick="editProduct(${p.id})">Edit</button>
                        <button class="btn btn-danger btn-small" onclick="deleteProduct(${p.id})">Delete</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Modal Logic
        document.getElementById('add-btn').addEventListener('click', () => openModal());
        
        function openModal(product = null) {
            modal.classList.remove('hidden');
            if (product) {
                document.getElementById('modal-title').textContent = 'Edit Product';
                document.getElementById('product-id').value = product.id;
                document.getElementById('p-name').value = product.name;
                document.getElementById('p-desc').value = product.description;
                document.getElementById('p-price').value = product.price;
                document.getElementById('p-unit').value = product.unit;
                document.getElementById('p-qty').value = product.quantity;
            } else {
                document.getElementById('modal-title').textContent = 'Add Product';
                form.reset();
                document.getElementById('product-id').value = '';
            }
        }

        window.closeModal = function() {
            modal.classList.add('hidden');
        }

        // Form Submit
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const productData = {
                name: document.getElementById('p-name').value,
                description: document.getElementById('p-desc').value,
                price: Number(document.getElementById('p-price').value),
                unit: document.getElementById('p-unit').value,
                quantity: Number(document.getElementById('p-qty').value),
                farmerId: user.id,
                location: user.location
            };

            let products = App.Store.get(App.Constants.STORAGE_KEYS.PRODUCTS, []);
            
            if (id) {
                // Edit
                const idx = products.findIndex(p => p.id == id);
                if (idx > -1) {
                    products[idx] = { ...products[idx], ...productData };
                    App.UI.showToast('Product updated');
                }
            } else {
                // Add
                productData.id = Date.now();
                products.push(productData);
                App.UI.showToast('Product added');
            }

            App.Store.set(App.Constants.STORAGE_KEYS.PRODUCTS, products);
            closeModal();
            loadProducts();
        });

        // Actions
        window.editProduct = function(id) {
            const products = App.Store.get(App.Constants.STORAGE_KEYS.PRODUCTS, []);
            const product = products.find(p => p.id === id);
            if (product) openModal(product);
        }

        window.deleteProduct = function(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            let products = App.Store.get(App.Constants.STORAGE_KEYS.PRODUCTS, []);
            products = products.filter(p => p.id !== id);
            App.Store.set(App.Constants.STORAGE_KEYS.PRODUCTS, products);
            App.UI.showToast('Product deleted');
            loadProducts();
        }

        // Check URL for auto-open
        if (window.location.search.includes('action=add')) {
            openModal();
        }

        loadProducts();
    </script>
</body>
</html>
